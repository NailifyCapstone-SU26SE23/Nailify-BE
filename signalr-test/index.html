<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nailify - SignalR Real-Time Test Client</title>
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for beautiful icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SignalR Client Library (Local first, then CDNs) -->
    <script src="signalr.min.js"></script>
    <script>
        if (typeof signalR === "undefined") {
            console.warn("Local signalr.min.js failed to load, falling back to jsDelivr...");
            document.write('<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@latest/dist/browser/signalr.min.js"><\/script>');
        }
    </script>
    <script>
        if (typeof signalR === "undefined") {
            console.warn("jsDelivr failed to load SignalR, falling back to unpkg...");
            document.write('<script src="https://unpkg.com/@microsoft/signalr/dist/browser/signalr.min.js"><\/script>');
        }
    </script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #f43f5e;
            --primary-hover: #e11d48;
            --primary-glow: rgba(244, 63, 94, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(244, 63, 94, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            background: linear-gradient(135deg, var(--primary), #ec4899);
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .brand-title h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #f3f4f6, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-title p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Status Indicator */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .status-badge.connected {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-badge.connecting {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            box-shadow: 0 0 10px currentColor;
        }

        /* Configuration Panel */
        .config-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .config-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: var(--text-muted);
        }

        .input-control {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
        }

        .input-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn {
            padding: 14px 28px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 20px rgba(244, 63, 94, 0.6);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--card-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .action-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        /* Feed & Notification Log Panel */
        .log-panel {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        .log-title {
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .log-list {
            max-height: 350px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
        }

        /* Custom Scrollbar */
        .log-list::-webkit-scrollbar {
            width: 6px;
        }

        .log-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .log-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .log-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .log-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            font-size: 14px;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: slideIn 0.3s ease-out;
        }

        .log-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .log-badge {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        .badge-promoted {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .badge-system {
            background: rgba(59, 130, 246, 0.15);
            color: var(--info);
        }

        .badge-error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }

        .log-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .log-message {
            color: #e5e7eb;
            font-weight: 500;
        }

        .log-json {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #a7f3d0;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .empty-log {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-style: italic;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="brand">
                <div class="brand-logo">
                    <i class="fa-solid fa-bell"></i>
                </div>
                <div class="brand-title">
                    <h1>Nailify SignalR Monitor</h1>
                    <p>Bộ công cụ kiểm thử thời gian thực cho hệ thống Waitlist/Booking</p>
                </div>
            </div>

            <div class="status-badge" id="statusBadge">
                <div class="status-dot"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </div>

        <!-- Configurations -->
        <div class="config-grid">
            <div class="form-group">
                <label for="hubUrl">SignalR Hub URL</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-link"></i>
                    <input type="text" id="hubUrl" class="input-control" value="https://localhost:7066/notifications"
                        placeholder="https://localhost:XXXX/notifications">
                </div>
            </div>

            <div class="form-group">
                <label for="accessToken">JWT Access Token (Khách hàng)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key"></i>
                    <input type="text" id="accessToken" class="input-control"
                        placeholder="Dán mã JWT Token của Khách hàng vào đây...">
                </div>
            </div>
        </div>

        <div class="action-row">
            <button id="btnConnect" class="btn btn-primary" onclick="toggleConnection()">
                <i class="fa-solid fa-plug"></i>
                <span>Connect</span>
            </button>
        </div>

        <!-- Log Panel -->
        <div class="log-panel">
            <div class="log-header">
                <div class="log-title">
                    <i class="fa-solid fa-list-ul"></i>
                    <span>Nhật ký thông báo (Notification Log)</span>
                </div>
                <button class="btn btn-secondary" style="padding: 6px 14px; font-size: 13px;" onclick="clearLogs()">
                    <i class="fa-solid fa-trash-can"></i> Xóa log
                </button>
            </div>

            <div class="log-list" id="logList">
                <div class="empty-log" id="emptyLog">Chưa có thông báo nào được nhận. Vui lòng kết nối và kích hoạt sự
                    kiện...</div>
            </div>
        </div>
    </div>

    <script>
        let connection = null;

        function updateStatus(status) {
            const badge = document.getElementById("statusBadge");
            const text = document.getElementById("statusText");
            const btnText = document.querySelector("#btnConnect span");
            const btnIcon = document.querySelector("#btnConnect i");

            badge.className = "status-badge";

            if (status === "connected") {
                badge.classList.add("connected");
                text.innerText = "Connected";
                btnText.innerText = "Disconnect";
                btnIcon.className = "fa-solid fa-power-off";
            } else if (status === "connecting") {
                badge.classList.add("connecting");
                text.innerText = "Connecting...";
                btnText.innerText = "Connecting";
                btnIcon.className = "fa-solid fa-spinner fa-spin";
            } else {
                text.innerText = "Disconnected";
                btnText.innerText = "Connect";
                btnIcon.className = "fa-solid fa-plug";
            }
        }

        async function confirmWaitlist(waitlistId) {
            const token = document.getElementById("accessToken").value.trim();
            const hubUrl = document.getElementById("hubUrl").value.trim();
            if (!token) {
                alert("Vui lòng nhập Access Token của khách hàng để gọi API!");
                return;
            }

            // Lấy base url của API (Ví dụ: https://localhost:7066/notifications -> https://localhost:7066/api)
            let baseUrl = hubUrl.substring(0, hubUrl.lastIndexOf('/'));
            const apiUrl = `${baseUrl}/api/Waitlists/${waitlistId}/confirm`;

            appendLog("badge-system", "System", `Đang gửi yêu cầu xác nhận giữ chỗ cho WaitlistId: ${waitlistId}...`);

            try {
                const response = await fetch(apiUrl, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({})
                });

                const data = await response.json();
                if (response.ok && data.isSucceeded) {
                    appendLog("badge-promoted", "Success", "Xác nhận hàng chờ thành công! Lịch hẹn chính thức đã được tạo.", data);
                } else {
                    appendLog("badge-error", "Error", "Xác nhận thất bại: " + (data.message || response.statusText), data);
                }
            } catch (err) {
                appendLog("badge-error", "Error", "Lỗi kết nối API: " + err.message);
                console.error(err);
            }
        }

        function appendLog(badgeType, badgeText, message, payload = null) {
            const emptyLog = document.getElementById("emptyLog");
            if (emptyLog) emptyLog.remove();

            const logList = document.getElementById("logList");
            const now = new Date();
            const timeStr = now.toLocaleTimeString() + "." + String(now.getMilliseconds()).padStart(3, '0');

            const logItem = document.createElement("div");
            logItem.className = "log-item";

            let payloadHtml = "";
            if (payload) {
                payloadHtml = `<pre class="log-json">${JSON.stringify(payload, null, 2)}</pre>`;
            }

            // Hiển thị nút Xác nhận nhanh nếu nhận được thông báo WaitlistPromoted
            let actionHtml = "";
            if (badgeText === "WaitlistPromoted" && payload && (payload.WaitlistId || payload.waitlistId)) {
                const waitlistId = payload.WaitlistId || payload.waitlistId;
                actionHtml = `
                    <div style="margin-top: 10px; display: flex; gap: 10px;">
                        <button class="btn" style="padding: 8px 16px; font-size: 13px; background: #10b981; color: white; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);" onclick="confirmWaitlist('${waitlistId}')">
                            <i class="fa-solid fa-circle-check"></i> Xác nhận đặt lịch (Confirm)
                        </button>
                    </div>
                `;
            }

            logItem.innerHTML = `
                <div class="log-meta">
                    <span class="log-badge ${badgeType}">${badgeText}</span>
                    <span class="log-time">${timeStr}</span>
                </div>
                <div class="log-message">${message}</div>
                ${payloadHtml}
                ${actionHtml}
            `;

            logList.insertBefore(logItem, logList.firstChild);
        }

        function clearLogs() {
            const logList = document.getElementById("logList");
            logList.innerHTML = `<div class="empty-log" id="emptyLog">Chưa có thông báo nào được nhận. Vui lòng kết nối và kích hoạt sự kiện...</div>`;
        }

        async function toggleConnection() {
            if (connection && connection.state === signalR.HubConnectionState.Connected) {
                // Đang kết nối, thực hiện ngắt kết nối
                try {
                    await connection.stop();
                    appendLog("badge-system", "System", "Đã chủ động ngắt kết nối.");
                } catch (err) {
                    appendLog("badge-error", "Error", "Lỗi khi ngắt kết nối: " + err);
                }
                return;
            }

            const hubUrl = document.getElementById("hubUrl").value.trim();
            const token = document.getElementById("accessToken").value.trim();

            if (!hubUrl) {
                alert("Vui lòng nhập Hub URL!");
                return;
            }

            if (!token) {
                alert("Vui lòng nhập Access Token!");
                return;
            }

            updateStatus("connecting");
            appendLog("badge-system", "System", "Bắt đầu kết nối tới: " + hubUrl);

            try {
                connection = new signalR.HubConnectionBuilder()
                    .withUrl(hubUrl, {
                        accessTokenFactory: () => token
                    })
                    .configureLogging(signalR.LogLevel.Information)
                    .withAutomaticReconnect()
                    .build();

                // Lắng nghe sự kiện ReceiveNotification
                connection.on("ReceiveNotification", (messageType, payload) => {
                    console.log("ReceiveNotification:", messageType, payload);
                    let badgeType = "badge-system";
                    if (messageType === "WaitlistPromoted") {
                        badgeType = "badge-promoted";
                    }

                    appendLog(badgeType, messageType, `Nhận sự kiện "${messageType}" từ Hub:`, payload);
                });

                // Các sự kiện kết nối
                connection.onclose(() => {
                    updateStatus("disconnected");
                    appendLog("badge-error", "Error", "Kết nối đã bị đóng.");
                });

                connection.onreconnecting((error) => {
                    updateStatus("connecting");
                    appendLog("badge-warning", "Warning", "Đang thử kết nối lại... Lý do: " + error);
                });

                connection.onreconnected((connectionId) => {
                    updateStatus("connected");
                    appendLog("badge-system", "System", "Đã kết nối lại thành công. ConnectionId: " + connectionId);
                });

                await connection.start();
                updateStatus("connected");
                appendLog("badge-system", "System", "Kết nối thành công! Hub ConnectionId: " + connection.connectionId);

            } catch (err) {
                updateStatus("disconnected");
                appendLog("badge-error", "Error", "Kết nối thất bại: " + err.message);
                console.error(err);
            }
        }
    </script>
</body>

</html>
