<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Đặt Lại Mật Khẩu - Nailify</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f5; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; border-top: 4px solid #ec4899;">
        <h2 style="color: #ec4899;">Đặt Lại Mật Khẩu Nailify</h2>
        <p>Xin chào <strong>[username]</strong>,</p>
        <p>Bạn đã yêu cầu đặt lại mật khẩu cho tài khoản Nailify của mình.</p>
        <p>Hãy sử dụng mã xác minh bên dưới trong vòng <strong>15 phút</strong>:</p>
        <p style="margin: 30px 0; text-align: center;">
            <span style="background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 100%); color: white; padding: 14px 28px; border-radius: 8px; font-size: 28px; font-weight: bold; letter-spacing: 6px; display: inline-block; box-shadow: 0 4px 10px rgba(236,72,153,0.3);">[resetCode]</span>
        </p>
        <p style="color: #6b7280; font-size: 13px;">Lưu ý: Nếu bạn không yêu cầu đặt lại mật khẩu, vui lòng bỏ qua email này. Mã này sẽ tự động hết hạn sau 15 phút.</p>
    </div>
</body>
</html>
