<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Nhắc Nhở Lịch Hẹn - Nailify</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f5; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px;">
        <h2 style="color: #ec4899;">Nhắc Nhở Lịch Hẹn Nailify</h2>
        <p>Xin chào <strong>[username]</strong>,</p>
        <p>Lịch hẹn làm đẹp của bạn tại chi nhánh <strong>[salonName]</strong> sẽ bắt đầu lúc <strong>[startTime]</strong> ngày <strong>[bookingDate]</strong> (sau 15 phút nữa).</p>
        <p>Vui lòng đến trước 5-10 phút để chúng tôi chuẩn bị tốt nhất cho bạn nhé!</p>
        <p>Thân ái,<br />Đội ngũ Nailify</p>
    </div>
</body>
</html>
